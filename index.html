<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5934A5">
<title>Our Sanctuary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Shown while we check if you are signed in -->
  <section class="login on" id="loading">
    <div class="logo">✦</div>
    <div class="sub">Opening your sanctuary…</div>
  </section>

  <!-- Login screen -->
  <section class="login" id="login">
    <div class="logo">✦</div>
    <h1>Our Sanctuary</h1>
    <p class="sub">A private home for the two of us.</p>
    <button class="btn" id="signin">Continue with Google</button>
    <div class="err" id="err"></div>
  </section>

  <!-- Signed-in screen (temporary: Home page comes next) -->
  <section class="page" id="main">
    <div class="top"><div><div class="sub">Signed in</div><h1 id="hello">Welcome</h1></div><span class="av" id="me">?</span></div>
    <div class="card hero">
      <div class="serif" style="font-size:22px">Login works ✦</div>
      <div style="opacity:.9;margin-top:6px">Only you and Rizuan can open this app.</div>
    </div>
    <div class="card">
      <b>Partner</b>
      <div class="sub" id="partner">Checking…</div>
    </div>
    <div class="card">
      <b>Your account</b>
      <div class="sub" id="email"></div>
    </div>
    <button class="btn ghost" id="signout">Sign out of this device</button>
  </section>

</div>
<script type="module" src="app.js"></script>
</body>
</html>
