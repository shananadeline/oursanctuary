<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5934A5">
<title>Our Sanctuary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.field{width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--bg);margin:4px 0 12px}
.lbl{font-size:13px;color:var(--tx2);margin-top:6px;display:block}
#nav{display:none}
#nav.on{display:flex}
</style>
</head>
<body>
<div id="app">

  <section class="login on" id="loading">
    <div class="logo">✦</div>
    <div class="sub">Opening your sanctuary…</div>
  </section>

  <section class="login" id="login">
    <div class="logo">✦</div>
    <h1>Our Sanctuary</h1>
    <p class="sub">A private home for the two of us.</p>
    <button class="btn" id="signin">Continue with Google</button>
    <div class="err" id="err"></div>
  </section>

  <!-- HOME -->
  <section class="page" id="home">
    <div class="top"><div><div class="sub" id="today"></div><h1 id="hello">Hello</h1></div><span class="av" id="me">?</span></div>
    <div class="card hero">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div><span class="av" id="av1">?</span><span class="av" id="av2">?</span></div>
        <span style="font-size:13px;opacity:.85" id="since"></span>
      </div>
      <div style="margin-top:14px"><span class="serif big" id="days">–</span><div style="opacity:.9" id="dayslabel">days together ✦</div></div>
    </div>
    <button class="card" id="homeChat" style="width:100%;text-align:left;display:flex;gap:12px;align-items:center">
      <span class="av" id="homeChatAv">?</span>
      <div style="flex:1;min-width:0"><b id="homeChatTitle">Chat</b><div class="sub" id="homeChatText" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>
      <span class="badge hide" id="homeChatBadge">0</span>
    </button>
    <div class="card"><h2 style="font-size:20px">Today</h2><div id="homeToday"></div></div>
    <div class="card"><h2 style="font-size:20px">Bills coming up</h2><div id="homeBills"></div></div>
    <div class="card"><h2 style="font-size:20px">Completed this week</h2>
      <div style="display:flex;gap:10px;margin-top:10px">
        <div style="flex:1;background:var(--pale);border-radius:18px;padding:12px"><div class="sub" id="wkName1"></div><b style="font-size:24px" id="wk1">0</b></div>
        <div style="flex:1;background:var(--pale);border-radius:18px;padding:12px"><div class="sub" id="wkName2"></div><b style="font-size:24px" id="wk2">0</b></div>
      </div>
    </div>
  </section>

  <!-- TASKS -->
  <section class="page" id="tasks">
    <div class="top"><h1>Tasks</h1></div>
    <div class="pills" id="filters"></div>
    <div id="groups"></div>
  </section>

  <!-- CHAT -->
  <section class="page chat" id="chat">
    <div class="chat-head">
      <button class="back" id="chatBack" style="margin:0">‹ Home</button>
      <span class="av s" id="chatAv">?</span>
      <div style="flex:1;min-width:0"><b id="chatName"></b><div class="sub" id="chatStatus"></div></div>
      <button class="round" id="chatSearchBtn" aria-label="Search messages">🔍</button>
    </div>
    <input class="field hide" id="chatSearch" placeholder="Search messages" autocomplete="off">
    <button class="pinbar hide" id="pinbar"></button>
    <div class="msgs" id="msgs"></div>
    <div class="compose">
      <input id="mi" placeholder="Message" maxlength="2000" autocomplete="off">
      <button class="round send" id="send" aria-label="Send">➤</button>
    </div>
  </section>

  <section class="page" id="restock">
    <div class="top"><h1>Restock</h1></div>
    <div class="pills" id="rsCats"></div>
    <div class="pills" id="rsQuick"></div>
    <div id="rsBody"></div>
  </section>
  <section class="page" id="calendar"><div class="top"><h1>Calendar</h1></div><div class="card"><div class="sub">Coming soon.</div></div></section>

  <!-- MORE / SETTINGS -->
  <section class="page" id="more">
    <div class="top"><h1>More</h1></div>
    <div class="tiles">
      <button class="tile" data-go="chat"><span>💬</span>Chat</button>
      <button class="tile" data-go="bills"><span>🧾</span>Bills</button>
      <button class="tile" data-go="expenses"><span>💸</span>Expenses</button>
      <button class="tile" data-go="groceries"><span>🥫</span>Groceries</button>
      <button class="tile" data-go="recipes"><span>🍳</span>Recipes</button>
      <button class="tile" data-soon="1"><span>✨</span>Wishlist</button>
      <button class="tile" data-soon="1"><span>🏦</span>Savings</button>
      <button class="tile" data-soon="1"><span>📝</span>Notes</button>
      <button class="tile" data-soon="1"><span>🐱</span>Pets</button>
      <button class="tile" data-go="settings"><span>⚙️</span>Settings</button>
    </div>
  </section>

  <!-- BILLS -->
  <section class="page" id="bills">
    <button class="back" data-go="more">‹ More</button>
    <div class="top"><h1>Bills</h1></div>
    <div class="pills" id="billTabs"></div>
    <div id="billBody"></div>
  </section>

  <!-- RECIPES -->
  <section class="page" id="recipes">
    <button class="back" data-go="more">‹ More</button>
    <div class="top"><h1>Recipes</h1></div>
    <input class="field" id="rcSearch" placeholder="Search recipes or ingredients" autocomplete="off">
    <div class="pills" id="rcCats"></div>
    <div id="rcBody"></div>
  </section>

  <!-- GROCERIES -->
  <section class="page" id="groceries">
    <button class="back" data-go="more">‹ More</button>
    <div class="top"><h1>Groceries</h1></div>
    <div id="grBody"></div>
  </section>

  <!-- EXPENSES -->
  <section class="page" id="expenses">
    <button class="back" data-go="more">‹ More</button>
    <div class="top"><h1>Expenses</h1></div>
    <div class="pills" id="expTabs"></div>
    <input class="field hide" id="expSearch" placeholder="Search expenses" autocomplete="off">
    <div id="expBody"></div>
  </section>

  <!-- SETTINGS -->
  <section class="page" id="settings">
    <button class="back" data-go="more">‹ More</button>
    <div class="top"><h1>Settings</h1></div>
    <div class="card">
      <b>Your profile</b>
      <label class="lbl" for="name">Display name</label>
      <input class="field" id="name" maxlength="30" autocomplete="off">
      <button class="btn" id="savename">Save name</button>
      <div class="sub" id="email" style="margin-top:10px"></div>
      <div class="sub" id="partner"></div>
    </div>
    <div class="card">
      <b>Our relationship</b>
      <label class="lbl" for="start">Relationship start date</label>
      <input class="field" id="start" type="date">
      <button class="btn" id="savestart">Save date</button>
    </div>
    <div class="card">
      <b>Appearance</b>
      <label class="lbl" for="theme">Theme</label>
      <select class="field" id="theme">
        <option value="auto">Automatic</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </div>
    <button class="btn ghost" id="signout">Sign out of this device</button>
  </section>

  <button class="btn fab hide" id="fab">+ New task</button>
  <nav id="nav"></nav>
  <div class="sheetbg" id="sbg"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
